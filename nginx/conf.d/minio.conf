server {
	listen 443;
	server_name minio.akhmadarief.id s3.akhmadarief.id;

	ssl_certificate /etc/ssl/cloudflare.pem;
	ssl_certificate_key /etc/ssl/cloudflare.key;

	proxy_buffering off;
	proxy_request_buffering off;
	ignore_invalid_headers off;

	location / {
		proxy_pass http://10.0.0.6:9000;

		#include snippets/proxy.conf;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 443;
	server_name minio-console.akhmadarief.id;

	ssl_certificate /etc/ssl/cloudflare.pem;
	ssl_certificate_key /etc/ssl/cloudflare.key;

	location / {
		proxy_pass http://10.0.0.6:9001;

		include snippets/proxy.conf;
		include snippets/websocket.conf;
	}
}
