services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - nginx-upstream

volumes:
  portainer_data:
    name: portainer_data

networks:
  nginx-upstream:
    external: true
